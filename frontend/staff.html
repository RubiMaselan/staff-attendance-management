<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal – AttendEase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>🏢 AttendEase</h2>
      <p>Staff Portal</p>
    </div>
    <nav class="sidebar-nav">
  <div class="nav-section">Attendance</div>

  <button class="nav-item active" data-tab="clockin" onclick="showTab('clockin')">
    <span class="nav-icon">🕐</span> Clock In/Out
  </button>

  <button class="nav-item" data-tab="history" onclick="showTab('history')">
    <span class="nav-icon">📋</span> My History
  </button>

  <button class="nav-item" data-tab="calendar" onclick="showTab('calendar')">
    <span class="nav-icon">🗓️</span> My Calendar
  </button>

  <div class="nav-section">Leave</div>

  <button class="nav-item" data-tab="leaves" onclick="showTab('leaves')">
    <span class="nav-icon">🏖️</span> My Leaves
  </button>
</nav>
    <div class="sidebar-user">
      <div class="sidebar-user-info">
        <div class="avatar" id="staffAvatar"></div>
        <div>
          <div class="avatar-name" id="staffName">Staff</div>
          <div class="avatar-role" id="staffType"></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px;color:#9ca3af" onclick="logout()">🚪 Sign Out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">Clock In / Out</h1>
      <div class="topbar-right">
        <span id="topDate" class="text-muted"></span>
      </div>
    </div>

    <div class="page-content">

      <!-- CLOCK IN/OUT TAB -->
      <div id="tab-clockin" class="tab-content">
        <div style="max-width:480px;margin:0 auto">
          <div class="card clock-card">
            <div class="clock-time" id="liveClock">00:00:00</div>
            <div class="clock-date" id="liveDate"></div>
            <div class="clock-status" id="todayStatus"></div>
            <div class="clock-actions">
              <button class="btn btn-success" id="btnClockIn" onclick="clockIn()">🟢 Clock In</button>
              <button class="btn btn-danger" id="btnClockOut" onclick="clockOut()" disabled>🔴 Clock Out</button>
            </div>
            <div id="clockAlert" style="margin-top:16px"></div>
          </div>

          <div class="card" style="margin-top:20px">
            <div class="card-title">📊 This Month at a Glance</div>
            <div id="monthStats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center">
              <div><div class="stat-value" id="ms_present" style="font-size:24px">–</div><div class="text-muted">Present</div></div>
              <div><div class="stat-value" id="ms_late" style="font-size:24px;color:var(--warning)">–</div><div class="text-muted">Late</div></div>
              <div><div class="stat-value" id="ms_halfday" style="font-size:24px;color:var(--info)">–</div><div class="text-muted">Half-day</div></div>
              <div><div class="stat-value" id="ms_absent" style="font-size:24px;color:var(--danger)">–</div><div class="text-muted">Absent</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- HISTORY TAB -->
      <div id="tab-history" class="tab-content" style="display:none">
        <div class="card">
          <div class="section-header">
            <div class="section-title">📋 Attendance History</div>
          </div>
          <div class="filter-bar">
            <label for="histMonth">Month</label>
<select id="histMonth"></select>

<label for="histYear">Year</label>
<select id="histYear"></select>
            <button class="btn btn-primary btn-sm" onclick="loadHistory()">Filter</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Status</th><th>Notes</th></tr></thead>
              <tbody id="historyTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- CALENDAR TAB -->
      <div id="tab-calendar" class="tab-content" style="display:none">
        <div class="card">
          <div class="section-header">
            <div class="section-title">🗓️ My Attendance Calendar</div>
          </div>
          <div class="filter-bar">
            <label for="calMonth">Month</label>
<select id="calMonth"></select>

<label for="calYear">Year</label>
<select id="calYear"></select>
            <button class="btn btn-primary btn-sm" onclick="loadMyCalendar()">View</button>
          </div>
          <div class="card-title" id="calTitle" style="margin-bottom:12px"></div>
          <div id="calendarGrid"></div>
        </div>
      </div>

      <!-- LEAVES TAB -->
      <div id="tab-leaves" class="tab-content" style="display:none">
        <div class="card">
          <div class="section-header">
            <div class="section-title">🏖️ My Leave Requests</div>
            <button class="btn btn-primary btn-sm" onclick="openModal('leaveModal')">+ Request Leave</button>
          </div>
          <div id="leaveAlert"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Type</th><th>Reason</th><th>Status</th></tr></thead>
              <tbody id="leavesTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- LEAVE REQUEST MODAL -->
<div id="leaveModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">Request Leave</div>
    <div id="leaveModalAlert"></div>
    <div class="form-group">
  <label for="lv_date">Date</label>
  <input id="lv_date" type="date">
</div>

<div class="form-group">
  <label for="lv_type">Leave Type</label>
  <select id="lv_type">
    <option value="Medical">Medical</option>
    <option value="Emergency">Emergency</option>
    <option value="Personal">Personal</option>
    <option value="Annual">Annual</option>
  </select>
</div>

<div class="form-group">
  <label for="lv_reason">Reason (optional)</label>
  <textarea id="lv_reason" placeholder="Describe your reason..."></textarea>
</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('leaveModal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitLeave()">Submit</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script type="module">
// ── AUTH CHECK ────────────────────────────────────────────────
const user = getUser();
if (!user) globalThis.location.href = 'index.html';
document.getElementById('staffName').textContent = user?.name || 'Staff';
document.getElementById('staffAvatar').textContent = (user?.name || 'S').charAt(0).toUpperCase();
document.getElementById('staffType').textContent = user?.staff_type || 'Staff';
document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

// Live clock
function tickClock() {
  const now = new Date();
  document.getElementById('liveClock').textContent = now.toTimeString().slice(0,8);
  document.getElementById('liveDate').textContent = now.toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
tickClock();
setInterval(tickClock, 1000);

// Populate month/year selects
function populateMonthYear(mId, yId) {
  const now = new Date();
  const mEl = document.getElementById(mId);
  const yEl = document.getElementById(yId);
  if (!mEl || !yEl) return;
  MONTHS.forEach((m,i) => {
    mEl.innerHTML += `<option value="${i+1}" ${i+1===now.getMonth()+1?'selected':''}>${m}</option>`;
  });
  for (let y = now.getFullYear(); y >= now.getFullYear()-2; y--) {
    yEl.innerHTML += `<option value="${y}" ${y===now.getFullYear()?'selected':''}>${y}</option>`;
  }
}
populateMonthYear('histMonth', 'histYear');
populateMonthYear('calMonth', 'calYear');

// Default leave date to today
document.getElementById('lv_date').valueAsDate = new Date();

// ── TABS ──────────────────────────────────────────────────────
const tabTitles = { clockin:'Clock In / Out', history:'My History', calendar:'My Calendar', leaves:'My Leaves' };
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).style.display = 'block';
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  document.getElementById('pageTitle').textContent = tabTitles[name];
  if (name === 'clockin') loadTodayStatus();
  if (name === 'history') loadHistory();
  if (name === 'calendar') loadMyCalendar();
  if (name === 'leaves') loadLeaves();
}

// ── CLOCK IN/OUT ──────────────────────────────────────────────
async function loadTodayStatus() {
  const d = await apiFetch('/attendance/today');
  const r = d.record;

  const outTime = r?.clock_out
    ? ` &nbsp;Out: <strong>${formatTime(r.clock_out)}</strong>`
    : '';

  const statusHtml =
    `${statusBadge(r.status)} &nbsp;In: <strong>${formatTime(r.clock_in)}</strong>${outTime}`;

  document.getElementById('todayStatus').innerHTML = statusHtml;

  document.getElementById('btnClockIn').disabled = !!(r?.clock_in);
  document.getElementById('btnClockOut').disabled = !(r?.clock_in) || !!(r?.clock_out);


  // Month stats
  const now = new Date();
  const records = await apiFetch(`/attendance/my?month=${now.getMonth()+1}&year=${now.getFullYear()}`);
  let p=0, l=0, h=0, a=0;
  records.forEach(r => {
    if (r.status==='present') p++;
    else if (r.status==='late') l++;
    else if (r.status==='half-day') h++;
    else if (r.status==='absent') a++;
  });
  document.getElementById('ms_present').textContent = p;
  document.getElementById('ms_late').textContent = l;
  document.getElementById('ms_halfday').textContent = h;
  document.getElementById('ms_absent').textContent = a;
}

async function clockIn() {
  try {
    const r = await apiFetch('/attendance/clockin', { method:'POST', body:{} });
    showAlert('clockAlert', `Clocked in at ${r.time} – ${r.status}!`);
    loadTodayStatus();
  } catch(e) { showAlert('clockAlert', e.message, 'error'); }
}

async function clockOut() {
  try {
    const r = await apiFetch('/attendance/clockout', { method:'POST', body:{} });
    const h = Math.floor(r.worked_minutes / 60);
    const m = r.worked_minutes % 60;
    showAlert('clockAlert', `Clocked out. Worked ${h}h ${m}m.`);
    loadTodayStatus();
  } catch(e) { showAlert('clockAlert', e.message, 'error'); }
}

// ── HISTORY ───────────────────────────────────────────────────
async function loadHistory() {
  const m = document.getElementById('histMonth').value;
  const y = document.getElementById('histYear').value;
  const records = await apiFetch(`/attendance/my?month=${m}&year=${y}`);
  document.getElementById('historyTable').innerHTML = records.length
    ? records.map(r => `<tr>
        <td>${formatDate(r.date)}</td>
        <td>${formatTime(r.clock_in)}</td>
        <td>${formatTime(r.clock_out)}</td>
        <td>${statusBadge(r.status)}</td>
        <td class="text-muted">${r.notes||'—'}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="empty-state">No records found</td></tr>';
}

// ── CALENDAR ──────────────────────────────────────────────────
async function loadMyCalendar() {
  const month = Number.parseInt(document.getElementById('calMonth').value);
const year  = Number.parseInt(document.getElementById('calYear').value);
  const records = await apiFetch(`/attendance/my?month=${month}&year=${year}`);
  document.getElementById('calTitle').textContent = `${MONTHS[month-1]} ${year}`;
  renderCalendar('calendarGrid', year, month, records);
}

// ── LEAVES ────────────────────────────────────────────────────
async function loadLeaves() {
  const leaves = await apiFetch('/leaves');
  document.getElementById('leavesTable').innerHTML = leaves.length
    ? leaves.map(l => `<tr>
        <td>${formatDate(l.date)}</td>
        <td><span class="badge badge-pending">${l.type}</span></td>
        <td>${l.reason||'—'}</td>
        <td>${statusBadge(l.status)}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" class="empty-state">No leave requests yet</td></tr>';
}

async function submitLeave() {
  try {
    await apiFetch('/leaves', { method:'POST', body: {
      date: document.getElementById('lv_date').value,
      type: document.getElementById('lv_type').value,
      reason: document.getElementById('lv_reason').value
    }});
    closeModal('leaveModal');
    showAlert('leaveAlert', 'Leave request submitted!');
    loadLeaves();
  } catch(e) { showAlert('leaveModalAlert', e.message, 'error'); }
}

// Init
await loadTodayStatus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System – Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="login-logo">
    <div class="logo-icon">🏢</div>
    <h1>AttendEase</h1>
    <p>Intern & Contract Staff Attendance</p>
  </div>
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
<input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <div id="loginError" class="alert alert-error" style="display:none"></div>
    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
  </form>
  <p class="login-hint">Demo: admin@company.com / admin123</p>
</div>

<script>
const API = 'http://localhost:3000/api';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  const err = document.getElementById('loginError');
  err.style.display = 'none';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    globalThis.location.href = data.user.role === 'admin'
  ? 'admin.html'
  : 'staff.html';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

// Redirect if already logged in
const user = JSON.parse(localStorage.getItem('user') || 'null');
globalThis.location.href = data.user.role === 'admin'
  ? 'admin.html'
  : 'staff.html';
</script>
</body>
</html>
